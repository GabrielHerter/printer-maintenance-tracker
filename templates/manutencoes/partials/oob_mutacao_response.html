{% if oob_update_table %}
<div id="tabela-manutencoes-container" hx-swap-oob="innerHTML">
    {% include "manutencoes/partials/tabela_manutencoes.html" %}
</div>
{% elif oob_row %}
    {% include "manutencoes/partials/linha_manutencao.html" %}
{% elif oob_stats %}
<p id="stat-total" hx-swap-oob="true" class="text-2xl font-bold text-slate-900 mt-0.5">{{ stats.total }}</p>
<p id="stat-em-manutencao" hx-swap-oob="true" class="text-2xl font-bold text-amber-700 mt-0.5">{{ stats.em_manutencao }}</p>
<p id="stat-resolvidos" hx-swap-oob="true" class="text-2xl font-bold text-emerald-700 mt-0.5">{{ stats.resolvidos }}</p>
<p id="stat-tempo-medio" hx-swap-oob="true" class="text-2xl font-bold text-brand-700 mt-0.5">{{ stats.tempo_medio }} <span class="text-xs font-normal text-slate-500">dias</span></p>
{% endif %}
