<tr id="item-row-{{ item.pk }}" class="hover:bg-slate-50/80 transition {% if not item.ativo %}bg-slate-50/50 text-slate-400{% endif %}">
    <td class="px-6 py-3.5 font-mono text-xs text-slate-400">
        #{{ item.pk }}
    </td>
    <td class="px-6 py-3.5 font-semibold {% if item.ativo %}text-slate-900{% else %}text-slate-400 line-through{% endif %}">
        {{ item.valor_principal }}
    </td>
    <td class="px-6 py-3.5 text-xs text-slate-500 whitespace-nowrap">
        {{ item.criado_em|date:"d/m/Y H:i" }}
    </td>
    <td class="px-6 py-3.5 text-center whitespace-nowrap">
        {% if item.ativo %}
        <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-700 ring-1 ring-inset ring-emerald-600/20">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
            Ativo
        </span>
        {% else %}
        <span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600 ring-1 ring-inset ring-slate-500/20">
            <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>
            Inativo
        </span>
        {% endif %}
    </td>
    <td class="px-6 py-3.5 text-right whitespace-nowrap">
        <button type="button"
                hx-post="{{ item.toggle_url }}"
                hx-target="#item-row-{{ item.pk }}"
                hx-swap="outerHTML"
                class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition cursor-pointer border
                {% if item.ativo %}
                    border-amber-200 bg-amber-50 text-amber-800 hover:bg-amber-100
                {% else %}
                    border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100
                {% endif %}"
                title="{% if item.ativo %}Inativar registro{% else %}Reativar registro{% endif %}">
            {% if item.ativo %}
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                </svg>
                Inativar
            {% else %}
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5 13l4 4L19 7" />
                </svg>
                Ativar
            {% endif %}
        </button>
    </td>
</tr>
{% if oob_stats %}
<p id="stat-total" hx-swap-oob="true" class="text-xl font-bold text-slate-900 mt-0.5">{{ stats.total }}</p>
<p id="stat-ativos" hx-swap-oob="true" class="text-xl font-bold text-emerald-600 mt-0.5">{{ stats.ativos }}</p>
<p id="stat-inativos" hx-swap-oob="true" class="text-xl font-bold text-slate-500 mt-0.5">{{ stats.inativos }}</p>
{% endif %}
